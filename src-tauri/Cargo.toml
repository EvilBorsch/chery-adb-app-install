[package]
name = "desaysv-apk-installer"
version = "1.1.2"
description = "APK installer for DesaySV Android head units"
authors = ["EvilBorsch"]
edition = "2021"

[lib]
name = "desaysv_apk_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
ureq = "3"
zip = "4"

[profile.release]
strip = true
debug = false
